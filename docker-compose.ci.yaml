version: '3.9'

x-base-service: &base-service
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - .:/app
  working_dir: /app
  # В .env нет ничего приватного: адреса сервисов внутри compose-сети и
  # тестовые учётные данные БД, которые и так лежат в migrations/postgres.
  # Поэтому в CI .env не нужен, настройки заданы переменными окружения.
  environment:
    # c-ares (DNS-резолвер gRPC по умолчанию) не видит встроенный DNS Docker,
    # поэтому имена контейнеров (grpc-mock) резолвим системным резолвером.
    GRPC_DNS_RESOLVER: native
    USERS_HTTP_CLIENT.HOST: http://http-mock:8003
    USERS_GRPC_CLIENT.PORT: 9003
    USERS_GRPC_CLIENT.HOST: grpc-mock
    CARDS_HTTP_CLIENT.HOST: http://http-mock:8003
    CARDS_GRPC_CLIENT.PORT: 9003
    CARDS_GRPC_CLIENT.HOST: grpc-mock
    ACCOUNTS_HTTP_CLIENT.HOST: http://http-mock:8003
    ACCOUNTS_GRPC_CLIENT.PORT: 9003
    ACCOUNTS_GRPC_CLIENT.HOST: grpc-mock
    GATEWAY_HTTP_SERVER.PORT: 8001
    GATEWAY_HTTP_SERVER.HOST: 0.0.0.0
    GATEWAY_GRPC_SERVER.PORT: 9001
    GATEWAY_GRPC_SERVER.HOST: 0.0.0.0
    OPERATIONS_HTTP_SERVER.PORT: 8002
    OPERATIONS_HTTP_SERVER.HOST: 0.0.0.0
    OPERATIONS_GRPC_SERVER.PORT: 9002
    OPERATIONS_GRPC_SERVER.HOST: 0.0.0.0
    OPERATIONS_KAFKA_CLIENT.PORT: 9092
    OPERATIONS_KAFKA_CLIENT.HOST: kafka
    OPERATIONS_POSTGRES_DATABASE.PORT: 5432
    OPERATIONS_POSTGRES_DATABASE.HOST: postgres
    OPERATIONS_POSTGRES_DATABASE.DRIVER: postgresql+asyncpg
    OPERATIONS_POSTGRES_DATABASE.DATABASE: operations_service_db
    OPERATIONS_POSTGRES_DATABASE.USERNAME: operations_service_user
    OPERATIONS_POSTGRES_DATABASE.PASSWORD: operations_service_password

x-python-service: &python-service
  <<: *base-service
  entrypoint: [ "python", "-u", "-m" ]

services:
  # kafka
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports: [ "9092:9092", "9093:9093" ]
    depends_on: [ "zookeeper" ]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    container_name: kafka

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    container_name: zookeeper

  # postgres
  postgres:
    image: postgres:15
    ports: [ "5432:5432" ]
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U root
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    container_name: postgres

  postgres-init:
    image: postgres:15
    volumes:
      - ./scripts:/scripts
      - ./migrations/postgres:/docker-entrypoint-initdb.d
    command: >
      bash -c "apt-get update && apt-get install -y dos2unix && dos2unix /scripts/postgres.sh && bash /scripts/postgres.sh"
    depends_on: [ "postgres" ]
    environment:
      PGPASSWORD: root
    container_name: postgres-init

  postgres-migrator-operations:
    <<: *base-service
    command: [ "alembic", "-c", "services/operations/alembic.ini", "upgrade", "head" ]
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    container_name: "postgres-migrator-operations"

  # mock-service
  http-mock:
    <<: *python-service
    ports: [ "8003:8003" ]
    command: "tests.mock.http.server"
    container_name: "http-mock"

  grpc-mock:
    <<: *python-service
    ports: [ "9003:9003" ]
    command: "tests.mock.grpc.server"
    container_name: "grpc-mock"

  # gateway-services
  http-gateway:
    <<: *python-service
    ports: [ "8001:8001" ]
    command: "services.gateway.server.http"
    container_name: "http-gateway"

  grpc-gateway:
    <<: *python-service
    ports: [ "9001:9001" ]
    command: "services.gateway.server.grpc"
    container_name: "grpc-gateway"

  # operations-service
  http-operations:
    <<: *python-service
    ports: [ "8002:8002" ]
    command: "services.operations.server.http"
    container_name: "http-operations"

  grpc-operations:
    <<: *python-service
    ports: [ "9002:9002" ]
    command: "services.operations.server.grpc"
    container_name: "grpc-operations"

  kafka-operations:
    <<: *python-service
    command: "services.operations.server.kafka"
    depends_on: [ "kafka" ]
    container_name: "kafka-operations"

volumes:
  pgdata:
